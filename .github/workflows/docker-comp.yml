name: Build and Release Docker Image Tar

on:
  push:
    tags:
      - 'v*' # Trigger only on version tags (e.g., v1.0.0)

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    # Required to create a GitHub Release and upload assets
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          # Build the image and tag it with the git tag name (e.g., v1.0.0)
          docker build -t app-image:${{ github.ref_name }} .

      - name: Save Docker image to TAR
        run: |
          # Save the image to a file named after the tag for clarity
          docker save app-image:${{ github.ref_name }} -o app-image-${{ github.ref_name }}.tar
          # Verify the file exists to prevent silent failures
          ls -lh app-image-${{ github.ref_name }}.tar

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          # The file to upload. Using the exact name avoids wildcard errors.
          files: app-image-${{ github.ref_name }}.tar
          # Optional: Generate release notes automatically
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send ntfy Notification
        if: success()
        run: |
          # Construct the URL to the release page for the Click action
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          
          # Send the notification using curl
          curl -X POST \
            -H "Title: New Docker Image Release: ${{ github.ref_name }}" \
            -H "Priority: default" \
            -H "Tags: package" \
            -H "Click: $RELEASE_URL" \
            -d "Docker image tar for ${{ github.ref_name }} is ready. Click to download." \
            https://ntfy.sh/az_alerts
